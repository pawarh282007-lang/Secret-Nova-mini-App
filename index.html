<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SECRET NOVA</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Top Header Section -->
        <header class="app-header">
            <div class="header-left">
                <button id="menu-btn" class="icon-btn-3d" aria-label="Settings Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="brand-logo-container">
                    <div class="sn-logo-circle">SN</div>
                    <div class="brand-text">
                        <span class="brand-title">SECRET NOVA</span>
                        <span class="brand-tagline">Play. Earn. Compete. Repeat.</span>
                    </div>
                </div>
            </div>
            
            <div class="header-right">
                <div class="currency-pill">
                    <span class="currency-icon coin">🪙</span>
                    <span id="coin-balance">12,450</span>
                </div>
                <div class="currency-pill">
                    <span class="currency-icon diamond">💎</span>
                    <span id="diamond-balance">860</span>
                </div>
                <div class="currency-pill">
                    <span class="currency-icon energy-ic">⚡</span>
                    <span id="energy-balance">2,350</span>
                </div>
                
                <div class="profile-pill" id="profile-btn">
                    <div class="profile-avatar" id="tg-avatar">H</div>
                    <span id="tg-name">Hemant</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
            </div>
        </header>

        <!-- Main Content Viewport -->
        <main id="main-content">
            <section id="view-board" class="view-section active">
                <!-- Game Board Hero Card -->
                <div class="board-hero-card card-3d">
                    <div class="board-hero-top">
                        <div class="board-title-group">
                            <h2>GAMEE BOARD</h2>
                            <p>Roll, Play & Win Rewards!</p>
                        </div>
                        <div class="streak-badge-sm">
                            <i class="fa-solid fa-fire"></i> <span id="streak-count">12</span> Day Streak
                        </div>
                    </div>

                    <div class="player-status-bar">
                        <div class="player-mini-profile">
                            <div class="avatar-ring">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Avatar" id="board-avatar">
                            </div>
                            <div class="player-info-text">
                                <h4 id="board-username">Hemant</h4>
                                <span class="handle">@Hemant_07</span>
                            </div>
                        </div>
                        <div class="player-stats-badges">
                            <div class="stat-badge">
                                <span class="badge-icon">👑</span>
                                <div>
                                    <small>Level</small>
                                    <strong>18</strong>
                                </div>
                            </div>
                            <div class="stat-badge">
                                <span class="badge-icon">🏆</span>
                                <div>
                                    <small>Rank</small>
                                    <strong>#125</strong>
                                </div>
                            </div>
                            <div class="stat-badge">
                                <span class="badge-icon">⭐</span>
                                <div>
                                    <small>Score</small>
                                    <strong>12,450</strong>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Trending Games Section inside Board -->
                    <div class="section-header-row" style="margin-top: 10px;">
                        <h3><i class="fa-solid fa-fire text-orange"></i> Trending Games</h3>
                        <button class="btn-text-link" id="view-all-games">View All <i class="fa-solid fa-chevron-right"></i></button>
                    </div>

                    <div class="games-horizontal-grid" id="trending-games-container">
                        <!-- Dynamically populated from games-registry.js -->
                    </div>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation Bar (Custom Layout) -->
        <nav class="bottom-nav-bar">
            <button class="nav-item" data-target="store">
                <i class="fa-solid fa-store"></i>
                <span>Nova Store</span>
            </button>
            <button class="nav-item" data-target="games">
                <i class="fa-solid fa-gamepad"></i>
                <span>Games</span>
            </button>
            <button class="nav-item active center-mic-btn" data-target="board">
                <div class="mic-glow-wrapper">
                    <i class="fa-solid fa-microphone"></i>
                </div>
                <span>Nova Home</span>
            </button>
            <button class="nav-item" data-target="rank">
                <i class="fa-solid fa-trophy"></i>
                <span>Rank</span>
            </button>
            <button class="nav-item" data-target="profile">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </button>
        </nav>
    </div>

    <!-- Modals Container -->
    <div id="modal-container" class="modal-backdrop hidden">
        <div class="modal-content card-3d" id="dynamic-modal-content"></div>
    </div>

    <!-- Scripts -->
    <script src="js/games-registry.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
</body>
  </html>
